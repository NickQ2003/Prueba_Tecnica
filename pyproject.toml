[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "unit: fast unit tests that do not require external services",
  "integration: PostgreSQL-backed application tests",
  "e2e: HTTP tests that require the Compose API, broker and worker",
]
